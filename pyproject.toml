[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mike_trade"
version = "0.1.0"
description = "Operator-supervised stock trading application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "alpaca-py>=0.21.0",
]

[project.scripts]
mike-trade = "mike_trade.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: test requiring live broker credentials",
    "paper: test requiring paper broker credentials",
]
addopts = "-m 'not live and not paper'"
