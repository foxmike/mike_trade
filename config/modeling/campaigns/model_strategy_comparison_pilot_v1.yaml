schema_version: 1
campaign_id: model_strategy_comparison_pilot_v1
description: >
  Pilot of the A-H comparison on five liquid symbols (40 jobs, no approval flag needed).
feed: iex
universe_file: config/research_universe_100_v1.json
universe_id: us-liquid-research-100-v1
symbols: [NVDA, MSFT, AAPL, AMZN, GOOGL]
dataset_root: research/data
model_root: research/models
output_root: research/model_campaigns
seed: 271828
starting_capital: "10000"
max_workers: 2            # keep small on the R730; the batch runner also caps by CPU and memory
max_entry_cycles_per_session: 10
market_status_enabled: true   # replay SPY, QQQ and IWM; CRASH/WARNING gate new entries as in SHADOW
market_status_enabled: true   # replay SPY/QQQ/IWM; CRASH/WARNING states gate new entries as in SHADOW

# The window is the models' own evaluation partition: after every fit, early-stopping and
# calibration range in config/modeling/*.yaml and before the reserved final holdout
# (2026-09-21 onward), which this tool refuses.
window:
  start: 2026-08-10T00:00:00Z
  end: 2026-09-21T00:00:00Z

execution:                # existing simulator assumptions: next-bar-open fills, stop-first ambiguity
  slippage_bps: "5"
protective_stop:
  type: native_trailing
  trail_percent: "1.5"
end_of_day_close:
  enabled: true
  at: "15:55"

# Named, exactly pinned model strategies. The artifact checksum is resolved from the immutable
# repository when the campaign is planned and recorded in every report.
models:
  xgb_buy:
    strategy: xgboost_probability_buy
    model_id: xgboost_buy_tb_pooled
    model_version: 1.0.0
    parameters: {minimum_favorable_probability_bps: 5500, maximum_adverse_probability_bps: 2500}
  lgbm_buy:
    strategy: lightgbm_probability_buy
    model_id: lightgbm_buy_tb_pooled
    model_version: 1.0.0
    parameters: {minimum_favorable_probability_bps: 5500, maximum_adverse_probability_bps: 2500}
  xgb_sell:
    strategy: xgboost_probability_sell
    model_id: xgboost_sell_continuation_pooled
    model_version: 1.0.0
    parameters: {minimum_exit_probability_bps: 6500}
  lgbm_sell:
    strategy: lightgbm_probability_sell
    model_id: lightgbm_sell_continuation_pooled
    model_version: 1.0.0
    parameters: {minimum_exit_probability_bps: 6500}

# Each configuration is an independent set of single-symbol accounts. Items are model names above
# or registered strategy ids; any other combination uses the same two lists.
configurations:
  A_xgb_buy_trail:        {buy: [xgb_buy],  sell: [], description: "XGBoost BUY, protective trailing stop only"}
  B_lgbm_buy_trail:       {buy: [lgbm_buy], sell: [], description: "LightGBM BUY, protective trailing stop only"}
  C_xgb_buy_xgb_sell:     {buy: [xgb_buy],  sell: [xgb_sell],  description: "XGBoost BUY + XGBoost SELL + protection"}
  D_lgbm_buy_lgbm_sell:   {buy: [lgbm_buy], sell: [lgbm_sell], description: "LightGBM BUY + LightGBM SELL + protection"}
  E_xgb_buy_lgbm_sell:    {buy: [xgb_buy],  sell: [lgbm_sell], description: "XGBoost BUY + LightGBM SELL + protection"}
  F_technical_buy_model_sell: {buy: [vwap_bounce], sell: [xgb_sell], description: "Existing VWAP bounce BUY + XGBoost SELL + protection"}
  G_model_buy_technical_sell: {buy: [xgb_buy], sell: [vwap_breakdown], description: "XGBoost BUY + existing VWAP breakdown SELL + protection"}
  H_baseline_vwap_reference:  {buy: [vwap_bounce], sell: [vwap_breakdown], description: "Existing technical reference pair, for comparison"}
