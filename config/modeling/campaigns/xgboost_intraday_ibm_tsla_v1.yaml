schema_version: 1
campaign_id: xgboost_intraday_ibm_tsla_v1
description: >
  Out-of-sample backtest of the two intraday candle-window XGBoost BUY models on IBM and TSLA:
  xgboost_buy_5m_tb100_050 (10 x 5m candles, 12-candle / 60 min horizon) and
  xgboost_buy_15m_tb100_050 (6 x 15m candles, 6-candle / 90 min horizon).  MODEL_DIRECTED
  decisions, protective 0.5% trailing stop only (the +1% training barrier is NOT a take-profit),
  15:55 end-of-day liquidation, no SELL strategy, no JEV review.  2 symbols x 2 configurations =
  4 jobs.  Execution assumptions, capital and window are those of the completed corrected
  comparison (model_strategy_comparison_model_directed_corrected_v1).
feed: iex
universe_file: config/research_universe_100_v1.json
universe_id: us-liquid-research-100-v1
symbols: [IBM, TSLA]
dataset_root: research/data
model_root: research/models
output_root: research/analysis/xgboost_intraday_ibm_tsla/campaign
seed: 271828
starting_capital: "10000"
max_workers: 4
worker_memory_mb: 1024
max_entry_cycles_per_session: 10
market_status_enabled: true

window:
  start: 2026-08-10T00:00:00Z
  end: 2026-09-21T00:00:00Z

execution:
  slippage_bps: "2"       # per side: every fill is moved 2 bps against the trader
protective_stop:
  type: native_trailing
  trail_percent: "0.5"
end_of_day_close:
  enabled: true
  at: "15:55"

# Launch requirements, checked against the EFFECTIVE resolved settings before any job starts.
expect:
  feed: iex
  slippage_bps: 2
  trail_percent: 0.5
  planned_jobs: 4
  trading_instruments: 2
  configurations: 2
  workers: 4
  model_directed: true
  evaluation_start: 2026-08-10T00:00:00Z
  evaluation_end: 2026-09-21T00:00:00Z

models:
  xgb_buy_5m:
    strategy: xgboost_probability_buy
    model_id: xgboost_buy_5m_tb100_050
    model_version: 1.0.0
    parameters: {decision_mode: MODEL_DIRECTED}
  xgb_buy_15m:
    strategy: xgboost_probability_buy
    model_id: xgboost_buy_15m_tb100_050
    model_version: 1.0.0
    parameters: {decision_mode: MODEL_DIRECTED}

configurations:
  XGB_5M_BUY_TRAIL:  {buy: [xgb_buy_5m],  sell: [], description: "XGBoost 5m-candle BUY, protective trailing stop only"}
  XGB_15M_BUY_TRAIL: {buy: [xgb_buy_15m], sell: [], description: "XGBoost 15m-candle BUY, protective trailing stop only"}
